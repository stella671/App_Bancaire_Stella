services:
  - type: web
    name: banking-app-backend
    env: node
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: banking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: banking-db
    region: frankfurt
    plan: free
    databaseName: banking
    user: banking_user
